# Compilacion de la app para iPhone en una Mac de GitHub (no hace falta tener Mac).
#
# - "build": compila para el simulador, sin firma. Corre solo en cada push que
#   toque ios/ o las dependencias, y sirve para saber que el proyecto compila.
# - "testflight": firma y sube el build a TestFlight. Se dispara a mano desde
#   Actions > iOS > Run workflow, tildando "Subir a TestFlight".
#   Necesita los secretos descriptos en docs/ios.md.
name: iOS

on:
  workflow_dispatch:
    inputs:
      subir_a_testflight:
        description: "Firmar y subir el build a TestFlight"
        type: boolean
        default: false
  push:
    branches: [main, master]
    paths:
      - "ios/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ios.yml"

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compilar (simulador, sin firma)
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Dependencias JS
        run: npm ci

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Pods
        working-directory: ios
        run: bundle exec pod install

      - name: Compilar
        run: |
          set -o pipefail
          xcodebuild \
            -workspace ios/MiApp.xcworkspace \
            -scheme MiApp \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build | tee "$RUNNER_TEMP/xcodebuild.log" | grep -E "error:|\*\* BUILD" || true
          grep -q "\*\* BUILD SUCCEEDED \*\*" "$RUNNER_TEMP/xcodebuild.log"

      - name: Log de compilacion
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: ${{ runner.temp }}/xcodebuild.log

  testflight:
    name: Firmar y subir a TestFlight
    if: github.event_name == 'workflow_dispatch' && inputs.subir_a_testflight
    needs: build
    runs-on: macos-15
    timeout-minutes: 90
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Dependencias JS
        run: npm ci

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Pods
        working-directory: ios
        run: bundle exec pod install

      - name: Clave de App Store Connect
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          if [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$APPLE_TEAM_ID" ] || [ -z "$ASC_KEY_P8_BASE64" ]; then
            echo "::error::Faltan secretos. Ver docs/ios.md"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/asc"
          echo "$ASC_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/asc/AuthKey.p8"

      # Cada subida a App Store Connect necesita un numero de build mayor al
      # anterior: se usa el numero de ejecucion del workflow.
      - name: Numero de build
        run: echo "BUILD_NUMBER=$((100 + ${{ github.run_number }}))" >> "$GITHUB_ENV"

      - name: Archivar
        run: |
          set -o pipefail
          xcodebuild \
            -workspace ios/MiApp.xcworkspace \
            -scheme MiApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Rutina360.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            archive | tee "$RUNNER_TEMP/archive.log" | grep -E "error:|\*\* ARCHIVE" || true
          grep -q "\*\* ARCHIVE SUCCEEDED \*\*" "$RUNNER_TEMP/archive.log"

      - name: Exportar y subir a TestFlight
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Rutina360.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: archive-log
          path: ${{ runner.temp }}/archive.log
